; Suppress PHP deprecation notices in HTTP responses.
; OJS 3.5 on PHP 8.3 triggers deprecation warnings in core code
; (hash_hmac null key, htmlspecialchars null string) that pollute
; API JSON responses and break downstream parsers.
display_errors = Off
log_errors = On

; OJS NativeImportExportPlugin calls tempnam('', ...) without a directory,
; which triggers PHP notices about falling back to the system temp dir.
; Setting sys_temp_dir explicitly avoids the warning.
sys_temp_dir = /tmp

; No X-Powered-By header: it told every visitor the exact PHP version, which is
; a scanner's shortlist the day an advisory like PHP2Shell is published.
expose_php = Off

; PHP2Shell hardening from the advisory (sansec.io/research/php2shell): one of
; the two bugs (CVE-2026-109618) is in the session upload-progress handler,
; which OJS does not use. Kept off after the patch too.
session.upload_progress.enabled = 0
